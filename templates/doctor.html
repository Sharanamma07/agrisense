<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Crop Doctor</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><nav><a class="brand" href="{{url_for('dashboard')}}">🌿 AgriSense</a><a href="{{url_for('logout')}}">Logout</a></nav><main class="wrap narrow"><a href="{{url_for('dashboard')}}">← Dashboard</a><h1>🩺 AI Crop Doctor</h1><div id="chat" class="panel"><p>👩‍🌾 Ask about treatment, prevention, spread, watering or food safety.</p></div><div class="actions"><input id="q" placeholder="Ask a question..." style="flex:1"><button class="btn primary" onclick="ask()">Ask</button></div><script>async function ask(){let q=document.getElementById('q');if(!q.value.trim())return;let c=document.getElementById('chat');c.innerHTML+='<p><b>You:</b> '+q.value+'</p>';let r=await fetch('{{url_for('doctor_ask')}}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.value})});let x=await r.json();c.innerHTML+='<p><b>🩺 AgriSense:</b> '+x.answer+'</p>';q.value=''}</script></main></body></html>
