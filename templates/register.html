<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgriSense Register</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="auth"><div class="panel"><div class="logo">🌱</div><h1>Create Account</h1>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="post"><label>Name</label><input name="name" required><label>Email</label><input type="email" name="email" required><label>Password</label><input type="password" name="password" minlength="6" required><label>Confirm Password</label><input type="password" name="confirm_password" minlength="6" required><button class="btn primary">🌱 Create Account</button></form><p>Already registered? <a href="{{url_for('login')}}">Login</a></p></div></main></body></html>
