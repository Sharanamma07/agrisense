<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Crops</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><nav><a class="brand" href="{{url_for('dashboard')}}">🌿 AgriSense</a><a href="{{url_for('logout')}}">Logout</a></nav><main class="wrap"><a href="{{url_for('dashboard')}}">← Dashboard</a><h1>🌱 My Crops</h1><div class="two"><div class="panel"><h2>Add crop</h2><form method="post"><label>Name</label><input name="name" placeholder="Tomato" required><label>Planting date</label><input type="date" name="planted_date"><label>Notes</label><textarea name="notes"></textarea><button class="btn primary">Add Crop</button></form></div><div>{% for c in crops %}<div class="panel"><h2>🌿 {{c.name}}</h2><p>Planted: {{c.planted_date or 'Not set'}}</p><p>{{c.notes or 'No notes.'}}</p><form method="post" action="{{url_for('delete_crop',crop_id=c.id)}}"><button>Delete</button></form></div>{% else %}<div class="panel">No crops yet.</div>{% endfor %}</div></div></main></body></html>
