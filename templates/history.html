<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan History</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><nav><a class="brand" href="{{url_for('dashboard')}}">🌿 AgriSense</a><a href="{{url_for('logout')}}">Logout</a></nav><main class="wrap"><a href="{{url_for('dashboard')}}">← Dashboard</a><h1>📋 Scan History</h1><div class="panel"><table><tr><th>Disease</th><th>Confidence</th><th>Date</th><th>Report</th><th>Delete</th></tr>{% for s in scans %}<tr><td>{{s.disease}}</td><td>{{s.confidence}}%</td><td>{{s.created_at}}</td><td><a href="{{url_for('report',scan_id=s.id)}}">PDF</a></td><td><form method="post" action="{{url_for('delete_scan',scan_id=s.id)}}"><button>Delete</button></form></td></tr>{% else %}<tr><td colspan="5">No scans yet.</td></tr>{% endfor %}</table></div></main></body></html>
