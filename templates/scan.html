<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgriSense Scanner</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><nav><a class="brand" href="{{url_for('dashboard')}}">🌿 AgriSense</a><span>👤 {{user_name}} &nbsp; <a href="{{url_for('logout')}}">Logout</a></span></nav><main class="wrap narrow"><a href="{{url_for('dashboard')}}">← Dashboard</a><h1>🔬 Analyze Your Plant</h1><p>Take a photo, upload, or drag and drop.</p><div id="drop" class="drop"><div class="big">🌿</div><h2>Drop a leaf image here</h2><div class="actions"><label class="btn primary">📁 Upload<input id="file" type="file" accept="image/*" hidden></label><label class="btn secondary">📷 Take Photo<input id="camera" type="file" accept="image/*" capture="environment" hidden></label></div></div><div id="preview" class="panel hidden"><img id="img"><div class="actions"><button id="go" class="btn primary">🔍 Analyze</button><button id="change" class="btn secondary">Change</button></div></div><div id="load" class="panel hidden">🤖 Analyzing...</div><div id="result" class="panel hidden"></div></main><script>const d=document.getElementById('drop'),f=document.getElementById('file'),cam=document.getElementById('camera'),pv=document.getElementById('preview'),im=document.getElementById('img'),go=document.getElementById('go'),ch=document.getElementById('change'),load=document.getElementById('load'),res=document.getElementById('result');let selected;function pick(x){if(!x||!x.type.startsWith('image/'))return alert('Please select an image.');selected=x;im.src=URL.createObjectURL(x);d.classList.add('hidden');pv.classList.remove('hidden');res.classList.add('hidden')}f.onchange=()=>pick(f.files[0]);cam.onchange=()=>pick(cam.files[0]);d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();pick(e.dataTransfer.files[0])};ch.onclick=()=>location.reload();go.onclick=async()=>{const fd=new FormData();fd.append('image',selected);load.classList.remove('hidden');res.classList.add('hidden');try{const r=await fetch('{{url_for('predict')}}',{method:'POST',body:fd});const t=await r.text();let x;try{x=JSON.parse(t)}catch{throw Error('Invalid server response. Check Render logs.')}if(!r.ok)throw Error(x.error||'Prediction failed');res.innerHTML='<h2>🦠 '+x.class.replaceAll('_',' ')+'</h2><h3>AI Confidence: '+x.confidence+'%</h3><div class="bar"><i style="width:'+x.confidence+'%"></i></div><h3>📋 Description</h3><p>'+x.description+'</p><h3>💊 Treatment</h3><p>'+x.treatment+'</p><h3>🛡️ Prevention</h3><p>'+x.prevention+'</p><h3>⚠️ Attention level</h3><p>'+x.severity+'</p><div class="actions"><a class="btn primary" href="{{url_for('history')}}">📋 History</a><a class="btn secondary" href="/report/'+x.scan_id+'">📄 PDF Report</a></div>';res.classList.remove('hidden')}catch(e){alert(e.message)}finally{load.classList.add('hidden')}};</script></body></html>
